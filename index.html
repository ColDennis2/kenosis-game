<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenosis — Card Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0D0F14;
      --surface:       #13161D;
      --surface2:      #1A1E28;
      --border:        #252B38;
      --border2:       #313848;
      --gold:          #C9A84C;
      --gold-dim:      #8A6E2F;
      --gold-glow:     rgba(201,168,76,0.1);
      --text:          #C8D0DC;
      --text-dim:      #5C6880;
      --error:         #C04444;
      --radius-sm:     6px;
      --radius:        8px;
      --radius-lg:     12px;
      --transition:    0.15s ease;
      /* aliases for existing index styles */
      --ink:           #0D0F14;
      --panel:         #13161D;
      --parchment:     #1A1E28;
      --border-rune:   #252B38;
      --border-bright: rgba(201,168,76,0.5);
      --text-main:     #C8D0DC;
      --text-muted:    #5C6880;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SCREENS ── */
    .screen { display: none; min-height: 100vh; animation: fadeIn 0.35s ease; }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ══════════════════════════════════════════
       HOME SCREEN
    ══════════════════════════════════════════ */
    #home {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem;
      background: var(--bg);
    }

    .home-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .home-crest {
      width: 96px; height: 96px;
      border: 2px solid var(--border-bright);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
      position: relative;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      z-index: 1;
    }
    .home-crest::before {
      content: '';
      position: absolute; inset: 6px;
      border: 1px solid var(--border-rune);
      border-radius: 50%;
    }
    .home-crest svg { width: 46px; height: 46px; }

    h1.home-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 28px rgba(201,168,76,0.22);
      z-index: 1;
    }

    p.home-sub {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.72rem, 1.6vw, 0.9rem);
      color: var(--text-muted);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 2.5rem;
      z-index: 1;
    }

    .home-divider {
      width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin-bottom: 2.5rem;
      z-index: 1;
    }

    .home-actions {
      display: flex; flex-direction: column; gap: 0.85rem;
      width: 100%; max-width: 300px;
      z-index: 1;
    }

    /* ── CARDS DECORATION ── */
    .home-cards {
      position: absolute; bottom: -28px;
      display: flex; gap: 10px;
      opacity: 0.12; pointer-events: none; filter: blur(1px);
    }
    .preview-card {
      width: 76px; height: 108px;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      background: linear-gradient(155deg, var(--surface2), var(--surface));
    }
    .preview-card:nth-child(1) { transform: rotate(-13deg) translateY(-12px); }
    .preview-card:nth-child(2) { transform: rotate(-4deg)  translateY(-4px); }
    .preview-card:nth-child(3) { transform: rotate(4deg)   translateY(-4px); }
    .preview-card:nth-child(4) { transform: rotate(13deg)  translateY(-12px); }

    /* ══════════════════════════════════════════
       AUTH SCREEN
    ══════════════════════════════════════════ */
    #auth {
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
    }

    .auth-panel {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      position: relative;
    }
    .auth-panel::before {
      content: '';
      position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      border-radius: 99px;
    }

    .auth-back {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; padding: 0;
      color: var(--text-muted); font-size: 0.76rem;
      letter-spacing: 0.05em; cursor: pointer;
      margin-bottom: 1.75rem;
      transition: var(--transition);
    }
    .auth-back:hover { color: var(--gold); }
    .auth-back svg { width: 13px; height: 13px; }

    .auth-logo {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 1.75rem;
    }
    .auth-logo-mark {
      width: 46px; height: 46px;
      border: 1px solid var(--border-bright);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.7rem;
      background: var(--gold-glow);
    }
    .auth-logo-mark svg { width: 22px; height: 22px; }

    .auth-mode-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem; font-weight: 700;
      color: var(--gold); letter-spacing: 0.08em;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 1.5rem;
      background: var(--surface2);
    }
    .auth-tab {
      flex: 1; padding: 0.52rem;
      background: transparent; border: none;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: var(--transition);
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--gold);
      box-shadow: inset 0 -2px 0 var(--gold);
    }
    .auth-tab:not(.active):hover { color: var(--text-main); }

    /* Forms */
    .auth-form { display: flex; flex-direction: column; gap: 0.9rem; }
    .auth-form[hidden] { display: none; }

    .form-field { display: flex; flex-direction: column; gap: 0.35rem; }

    label.form-label {
      font-size: 0.7rem; font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.12em; text-transform: uppercase;
    }

    input.form-input {
      width: 100%; padding: 0.68rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: 'Inter', sans-serif; font-size: 0.88rem;
      outline: none; transition: var(--transition);
    }
    input.form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }
    input.form-input::placeholder { color: var(--text-dim); }
    input.form-input.invalid { border-color: var(--error); }

    .form-error {
      font-size: 0.72rem; color: var(--error);
      display: none;
    }
    .form-error.show { display: block; }

    .form-hint {
      font-size: 0.7rem; color: var(--text-dim);
      background: none; border: none; padding: 0;
      cursor: pointer; align-self: flex-end;
      transition: var(--transition);
    }
    .form-hint:hover { color: var(--gold); }

    /* Buttons */
    .btn-primary {
      width: 100%; padding: 0.82rem;
      background: var(--gold); color: #0D0F14;
      border: none; border-radius: var(--radius-sm);
      font-family: 'Cinzel', serif;
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: var(--transition);
    }
    .btn-primary:hover:not(:disabled) { background: #ddb85a; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .btn-outline {
      width: 100%; padding: 0.82rem;
      background: transparent; color: var(--gold);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      font-family: 'Cinzel', serif;
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: var(--transition);
    }
    .btn-outline:hover { background: var(--gold-glow); border-color: var(--gold); }

    .btn-ghost {
      width: 100%; background: none; border: none; padding: 0.5rem;
      color: var(--text-muted); font-size: 0.78rem;
      letter-spacing: 0.04em; cursor: pointer;
      transition: var(--transition);
    }
    .btn-ghost:hover { color: var(--text-main); }

    .btn-dashed {
      width: 100%; padding: 0.62rem;
      background: transparent; color: var(--text-muted);
      border: 1px dashed rgba(201,168,76,0.2);
      border-radius: var(--radius-sm);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: var(--transition);
    }
    .btn-dashed:hover { border-color: var(--border-bright); color: var(--text-main); }

    .auth-divider {
      display: flex; align-items: center; gap: 0.7rem;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.1em; }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(13,15,20,0.35);
      border-top-color: #0D0F14;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--gold);
      color: #0D0F14;
      padding: 0.5rem 1.2rem;
      border-radius: 100px;
      font-size: 0.78rem; font-weight: 600;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
      opacity: 0; transition: all 0.25s ease;
      z-index: 999; white-space: nowrap; pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- ══════════════ HOME ══════════════ -->
<div id="home" class="screen active">
  <div class="home-grid"></div>

  <div class="home-crest">
    <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="22,4 28,18 44,18 32,28 36,42 22,34 8,42 12,28 0,18 16,18"
               fill="none" stroke="#c9a84c" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6" fill="none" stroke="#c9a84c" stroke-width="1"/>
    </svg>
  </div>

  <h1 class="home-title">Kenosis</h1>
  <p class="home-sub">Card Planner</p>
  <div class="home-divider"></div>

  <div class="home-actions">
    <button class="btn-primary"  onclick="showAuth('login')"   >Enter the Planner</button>
    <button class="btn-outline"  onclick="showAuth('register')">Create Account</button>
    <button class="btn-ghost"    onclick="guestEnter()"        >Continue as Guest</button>
  </div>

  <div class="home-cards" aria-hidden="true">
    <div class="preview-card"></div>
    <div class="preview-card"></div>
    <div class="preview-card"></div>
    <div class="preview-card"></div>
  </div>
</div>

<!-- ══════════════ AUTH ══════════════ -->
<div id="auth" class="screen">
  <div class="auth-panel">

    <button class="auth-back" onclick="show('home')" aria-label="Back to home">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      Back
    </button>

    <div class="auth-logo">
      <div class="auth-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="22,4 28,18 44,18 32,28 36,42 22,34 8,42 12,28 0,18 16,18"
                   fill="none" stroke="#c9a84c" stroke-width="1.8"/>
        </svg>
      </div>
      <p class="auth-mode-title" id="authTitle">Sign In</p>
    </div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="tab-login"    role="tab" aria-selected="true"
              onclick="switchTab('login')"   >Sign In</button>
      <button class="auth-tab"        id="tab-register" role="tab" aria-selected="false"
              onclick="switchTab('register')">Register</button>
    </div>

    <!-- ── LOGIN ── -->
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)" novalidate
          role="tabpanel" aria-labelledby="tab-login">

      <div class="form-field">
        <label class="form-label" for="loginEmail">Email</label>
        <input class="form-input" id="loginEmail" type="email"
               placeholder="maker@kenosis.gg" autocomplete="email" />
        <span class="form-error" id="loginEmailErr">Enter a valid email address</span>
      </div>

      <div class="form-field">
        <label class="form-label" for="loginPass">Password</label>
        <input class="form-input" id="loginPass" type="password"
               placeholder="••••••••" autocomplete="current-password" />
        <span class="form-error" id="loginPassErr">Incorrect email or password</span>
        <button type="button" class="form-hint" onclick="toast('Password reset link sent to your email')">
          Forgot password?
        </button>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Enter the Planner</button>

      <div class="auth-divider">
        <div class="divider-line"></div>
        <span class="divider-text">or</span>
        <div class="divider-line"></div>
      </div>

      <button type="button" class="btn-dashed" onclick="guestEnter()">Continue as Guest</button>
    </form>

    <!-- ── REGISTER ── -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)" novalidate
          role="tabpanel" aria-labelledby="tab-register" hidden>

      <div class="form-field">
        <label class="form-label" for="regName">Display Name</label>
        <input class="form-input" id="regName" type="text"
               placeholder="The Architect" autocomplete="nickname" />
        <span class="form-error" id="regNameErr">Name is required</span>
      </div>

      <div class="form-field">
        <label class="form-label" for="regEmail">Email</label>
        <input class="form-input" id="regEmail" type="email"
               placeholder="maker@kenosis.gg" autocomplete="email" />
        <span class="form-error" id="regEmailErr">Enter a valid email address</span>
      </div>

      <div class="form-field">
        <label class="form-label" for="regPass">Password</label>
        <input class="form-input" id="regPass" type="password"
               placeholder="Min. 8 characters" autocomplete="new-password" />
        <span class="form-error" id="regPassErr">At least 8 characters required</span>
      </div>

      <div class="form-field">
        <label class="form-label" for="regPassConfirm">Confirm Password</label>
        <input class="form-input" id="regPassConfirm" type="password"
               placeholder="••••••••" autocomplete="new-password" />
        <span class="form-error" id="regPassConfirmErr">Passwords don't match</span>
      </div>

      <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>

      <div class="auth-divider">
        <div class="divider-line"></div>
        <span class="divider-text">or</span>
        <div class="divider-line"></div>
      </div>

      <button type="button" class="btn-dashed" onclick="guestEnter()">Continue as Guest</button>
    </form>

  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  /* ── Supabase ── */
  const SB_URL = 'https://efprarpfgwiihrbwgxhz.supabase.co';
  const SB_KEY = 'sb_publishable_xx51FbZeklVxb8subL8fNQ_gVMQogIl';

  function sbHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Prefer': 'return=representation'
    };
  }

  /* ── Session ── */
  const SESSION_KEY = 'kenosis_session';
  function loadSession(){ return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
  function saveSession(u){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)); }

  /* ── Screen routing ── */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showAuth(mode) {
    show('auth');
    switchTab(mode || 'login');
  }

  /* ── Tab switch ── */
  function switchTab(tab) {
    const isLogin = (tab === 'login');
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('tab-login').setAttribute('aria-selected', isLogin);
    document.getElementById('tab-register').setAttribute('aria-selected', !isLogin);
    document.getElementById('loginForm').hidden    = !isLogin;
    document.getElementById('registerForm').hidden = isLogin;
    document.getElementById('authTitle').textContent = isLogin ? 'Sign In' : 'Register';
    clearErrors();
  }

  /* ── Validation helpers ── */
  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(e => e.classList.remove('show'));
    document.querySelectorAll('.form-input').forEach(i => i.classList.remove('invalid'));
  }

  function fieldError(errId, inputId, msg) {
    const err = document.getElementById(errId);
    if (msg) err.textContent = msg;
    err.classList.add('show');
    document.getElementById(inputId).classList.add('invalid');
    return false;
  }

  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  /* ── Login ── */
  async function handleLogin(e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    let ok = true;

    if (!validEmail(email))
      ok = fieldError('loginEmailErr', 'loginEmail', 'Enter a valid email address');
    if (!pass)
      ok = fieldError('loginPassErr', 'loginPass', 'Password is required') && ok;
    if (!ok) return;

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Entering…';

    try {
      const res = await fetch(
        `${SB_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&password=eq.${encodeURIComponent(pass)}&select=id,name,email`,
        { headers: sbHeaders() }
      );
      const rows = await res.json();
      if (!rows.length) {
        btn.disabled = false;
        btn.textContent = 'Enter the Planner';
        fieldError('loginPassErr', 'loginPass', 'Incorrect email or password');
        return;
      }
      const user = { ...rows[0], guest: false };
      saveSession(user);
      enterForge(user);
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Enter the Planner';
      fieldError('loginPassErr', 'loginPass', 'Connection error — try again');
    }
  }

  /* ── Register ── */
  async function handleRegister(e) {
    e.preventDefault();
    clearErrors();

    const name    = document.getElementById('regName').value.trim();
    const email   = document.getElementById('regEmail').value.trim();
    const pass    = document.getElementById('regPass').value;
    const confirm = document.getElementById('regPassConfirm').value;
    let ok = true;

    if (!name)              ok = fieldError('regNameErr',        'regName',        'Name is required');
    if (!validEmail(email)) ok = fieldError('regEmailErr',       'regEmail',       'Enter a valid email address') && ok;
    if (pass.length < 8)   ok = fieldError('regPassErr',        'regPass',        'At least 8 characters required') && ok;
    if (pass !== confirm)  ok = fieldError('regPassConfirmErr', 'regPassConfirm', "Passwords don't match") && ok;
    if (!ok) return;

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Creating account…';

    try {
      // Check email not already taken
      const check = await fetch(
        `${SB_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&select=id`,
        { headers: sbHeaders() }
      );
      const existing = await check.json();
      if (existing.length) {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        fieldError('regEmailErr', 'regEmail', 'This email is already registered');
        return;
      }

      // Insert new user
      const res = await fetch(`${SB_URL}/rest/v1/users`, {
        method: 'POST',
        headers: sbHeaders(),
        body: JSON.stringify({ name, email, password: pass })
      });
      const rows = await res.json();
      const user = { ...rows[0], guest: false };
      saveSession(user);
      toast('Welcome, ' + name + '!');
      enterForge(user);
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Create Account';
      fieldError('regEmailErr', 'regEmail', 'Connection error — try again');
    }
  }

  /* ── Guest ── */
  function guestEnter() {
    const user = { name: 'Guest', email: null, guest: true };
    saveSession(user);
    enterForge(user);
  }

  /* ── Enter the app ── */
  function enterForge(user) {
    window.location.href = './card-forge.html';
  }

  /* ── Toast ── */
  let _toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  /* ── Auto-restore session ── */
  (function init() {
    const session = loadSession();
    if (session) enterForge(session);
  })();
