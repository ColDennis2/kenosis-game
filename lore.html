<!DOCTYPE html>
<html lang="en">
<head>
<script src="./auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenosis — Lore</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0D0F14;
    --surface:   #13161D;
    --surface2:  #1A1E28;
    --border:    #252B38;
    --border2:   #313848;
    --gold:      #C9A84C;
    --gold-dim:  #8A6E2F;
    --crimson:   #8B2E2E;
    --text:      #C8D0DC;
    --text-dim:  #5C6880;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }

  /* ── Header ── */
  header {
    padding: 0.7rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 1rem;
    position: relative;
    flex-shrink: 0;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
  }
  .header-crest {
    width: 36px; height: 36px;
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
  }
  .header-crest svg { width: 18px; height: 18px; }
  header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--gold);
  }
  header h1 span {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-left: 0.5rem;
  }
  .header-nav {
    display: flex;
    gap: 0.25rem;
    margin-left: 1.5rem;
  }
  .header-nav a {
    padding: 0.28rem 0.7rem;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-dim);
    text-decoration: none;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .header-nav a:hover { color: var(--text); background: var(--surface2); }
  .header-nav a.active { color: var(--gold); border-color: var(--border2); background: var(--surface2); }
  .header-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.72rem; color: var(--text-dim);
  }
  .header-right button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .header-right button:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* ── Layout ── */
  .page { flex: 1; display: flex; gap: 0; min-height: 0; }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 1rem 1.1rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .btn-add-entry {
    display: flex; align-items: center; gap: 4px;
    padding: 0.3rem 0.6rem;
    background: var(--gold);
    color: #0D0F14;
    border: none;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add-entry:hover { background: #d9b85c; }

  .entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }
  .entry-list::-webkit-scrollbar { width: 4px; }
  .entry-list::-webkit-scrollbar-track { background: transparent; }
  .entry-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .entry-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.65rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  .entry-item:hover { background: var(--surface2); }
  .entry-item.active { background: var(--surface2); border-color: var(--border2); }
  .entry-item.active .entry-item-title { color: var(--gold); }
  .entry-item-icon {
    width: 28px; height: 28px;
    border-radius: 4px;
    background: var(--border);
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    color: var(--text-dim);
  }
  .entry-item-icon img { width: 100%; height: 100%; object-fit: cover; }
  .entry-item-body { flex: 1; min-width: 0; }
  .entry-item-title {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-item-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .entry-item-del {
    flex-shrink: 0;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    opacity: 0;
    transition: all 0.15s;
  }
  .entry-item:hover .entry-item-del { opacity: 1; }
  .entry-item-del:hover { color: var(--crimson); background: rgba(139,46,46,0.15); }

  .sidebar-empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    line-height: 1.6;
  }

  /* ── Editor panel ── */
  .editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: var(--text-dim);
  }
  .editor-empty-icon {
    width: 52px; height: 52px;
    border: 1px solid var(--border2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5;
  }
  .editor-empty p { font-size: 0.8rem; }

  .editor-form {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-toolbar {
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
    flex-shrink: 0;
  }
  .editor-toolbar-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    flex: 1;
  }
  .btn-save {
    padding: 0.32rem 0.85rem;
    background: var(--gold);
    color: #0D0F14;
    border: none;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-save:hover { background: #d9b85c; }
  .btn-discard {
    padding: 0.32rem 0.75rem;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border2);
    border-radius: 4px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-discard:hover { border-color: var(--border2); color: var(--text); }

  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 2.5rem;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  .editor-scroll::-webkit-scrollbar { width: 4px; }
  .editor-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Fields */
  .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
  .field label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .field input[type="text"], .field textarea {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 0.6rem 0.8rem;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
    resize: vertical;
  }
  .field input[type="text"]:focus, .field textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }
  .field input[type="text"]::placeholder, .field textarea::placeholder { color: var(--text-dim); }
  .field textarea { min-height: 160px; line-height: 1.65; }

  .field-title-input {
    font-size: 1.35rem !important;
    font-weight: 600 !important;
    font-family: 'Cinzel', serif !important;
    letter-spacing: 0.04em !important;
    color: var(--gold) !important;
  }

  /* Image upload */
  .img-upload-wrap {
    position: relative;
    border: 1px dashed var(--border2);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
  }
  .img-upload-wrap:hover { border-color: var(--gold-dim); }
  .img-upload-wrap input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .img-upload-placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    color: var(--text-dim); font-size: 0.75rem; pointer-events: none;
  }
  .img-upload-placeholder svg { opacity: 0.4; }
  .img-preview {
    width: 100%; max-height: 300px;
    object-fit: cover;
    display: none;
  }
  .img-preview.visible { display: block; }
  .img-clear {
    position: absolute; top: 8px; right: 8px;
    background: rgba(13,15,20,0.75);
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 0.68rem;
    padding: 3px 7px;
    cursor: pointer;
    display: none;
    transition: all 0.15s;
    z-index: 2;
  }
  .img-clear:hover { color: var(--crimson); }
  .img-clear.visible { display: block; }

  /* ── Read view ── */
  .read-view {
    flex: 1;
    overflow-y: auto;
    padding: 2.5rem 2.5rem;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  .read-view::-webkit-scrollbar { width: 4px; }
  .read-view::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .read-title {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
    line-height: 1.2;
  }
  .read-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
    margin: 1rem 0 1.5rem;
  }
  .read-image {
    width: 100%;
    max-height: 340px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
    display: none;
  }
  .read-image.visible { display: block; }
  .read-body {
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }
  .read-actions {
    margin-top: 2rem;
    display: flex;
    gap: 0.5rem;
  }
  .btn-edit {
    padding: 0.35rem 0.85rem;
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border2);
    border-radius: 4px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-edit:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* Toast */
  #toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--gold); color: #0D0F14;
    padding: 0.5rem 1.2rem;
    border-radius: 100px;
    font-size: 0.78rem; font-weight: 600;
    box-shadow: 0 4px 20px rgba(201,168,76,0.3);
    opacity: 0; transition: all 0.25s ease;
    z-index: 999; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Drag handle */
  .entry-item { user-select: none; }
  .entry-item.dragging { opacity: 0.4; }
  .entry-item.drag-over { border-color: var(--gold-dim) !important; background: rgba(201,168,76,0.05) !important; }

  @media (max-width: 640px) {
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .page { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div class="header-crest" aria-hidden="true">
    <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="22,4 28,18 44,18 32,28 36,42 22,34 8,42 12,28 0,18 16,18"
               fill="none" stroke="#c9a84c" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6" fill="none" stroke="#c9a84c" stroke-width="1"/>
    </svg>
  </div>
  <h1>Kenosis <span>Lore</span></h1>
  <nav class="header-nav">
    <a href="./card-forge.html">Card Planner</a>
    <a href="./lore.html" class="active">Lore</a>
    <a href="./status-effects.html">Status Effects</a>
  </nav>
  <div class="header-right">
    <span id="headerUser"></span>
    <button onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Entries</h2>
      <button class="btn-add-entry" onclick="newEntry()">+ New</button>
    </div>
    <div class="entry-list" id="entryList"></div>
  </aside>

  <!-- EDITOR / VIEWER -->
  <div class="editor" id="editorPanel">
    <div class="editor-empty" id="editorEmpty">
      <div class="editor-empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 6.5v11M6.5 12h11" stroke-linecap="round"/>
        </svg>
      </div>
      <p>Select an entry or create a new one</p>
    </div>

    <!-- EDIT FORM -->
    <div class="editor-form" id="editorForm" style="display:none">
      <div class="editor-toolbar">
        <span class="editor-toolbar-title" id="editorToolbarLabel">New Entry</span>
        <button class="btn-discard" onclick="discardEdit()">Discard</button>
        <button class="btn-save" onclick="saveEntry()">Save</button>
      </div>
      <div class="editor-scroll">
        <div class="field">
          <label>Title</label>
          <input type="text" id="f-title" class="field-title-input" placeholder="e.g. The First Age" maxlength="80">
        </div>
        <div class="field">
          <label>Image</label>
          <div class="img-upload-wrap" id="imgWrap">
            <input type="file" id="f-img" accept="image/*" onchange="handleImg(this)">
            <img class="img-preview" id="imgPreview" alt="">
            <button type="button" class="img-clear" id="imgClear" onclick="clearImg(event)">✕ Remove</button>
            <div class="img-upload-placeholder" id="imgPlaceholder">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>Click to upload image</span>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Text</label>
          <textarea id="f-body" placeholder="Write the lore entry here…"></textarea>
        </div>
      </div>
    </div>

    <!-- READ VIEW -->
    <div class="read-view" id="readView" style="display:none">
      <h2 class="read-title" id="rv-title"></h2>
      <div class="read-divider"></div>
      <img class="read-image" id="rv-image" alt="">
      <div class="read-body" id="rv-body"></div>
      <div class="read-actions">
        <button class="btn-edit" onclick="editCurrent()">✎ Edit</button>
        <button class="btn-edit" onclick="deleteEntry(currentId)" style="color:var(--crimson)">✕ Delete</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── Supabase ── */
const SB_URL = 'https://efprarpfgwiihrbwgxhz.supabase.co';
const SB_KEY = 'sb_publishable_xx51FbZeklVxb8subL8fNQ_gVMQogIl';

function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Prefer': 'return=representation'
  };
}

/* ── Auth ── */
function getSession() {
  try { return JSON.parse(sessionStorage.getItem('kenosis_session') || 'null'); } catch(e) { return null; }
}
function signOut() {
  sessionStorage.removeItem('kenosis_session');
  window.location.replace('./index.html');
}
(function initHeader() {
  const s = getSession();
  const el = document.getElementById('headerUser');
  if (el && s) el.textContent = s.guest ? 'Guest' : (s.name || s.email);
})();

/* ── State ── */
let entries    = [];   // [{ id, title, body, image, order }]
let currentId  = null;
let editing    = false;

/* ── Supabase persistence ── */
async function loadEntries() {
  const s = getSession();
  if (!s || s.guest) {
    try { entries = JSON.parse(localStorage.getItem('kenosis_lore_guest') || '[]'); } catch(e) { entries = []; }
    return;
  }
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/lore_entries?user_id=eq.${s.id}&select=entry_data&order=entry_data->order.asc`,
      { headers: sbHeaders() }
    );
    if (!res.ok) throw new Error();
    const rows = await res.json();
    entries = rows.map(r => r.entry_data);
  } catch(e) {
    try { entries = JSON.parse(localStorage.getItem('kenosis_lore_' + s.id) || '[]'); } catch(_) { entries = []; }
  }
}

async function persistEntries() {
  const s = getSession();
  if (!s || s.guest) {
    try { localStorage.setItem('kenosis_lore_guest', JSON.stringify(entries)); } catch(e) {}
    return;
  }
  try {
    await fetch(`${SB_URL}/rest/v1/lore_entries?user_id=eq.${s.id}`, {
      method: 'DELETE', headers: sbHeaders()
    });
    if (entries.length) {
      await fetch(`${SB_URL}/rest/v1/lore_entries`, {
        method: 'POST',
        headers: sbHeaders(),
        body: JSON.stringify(entries.map(e => ({ user_id: s.id, entry_data: e })))
      });
    }
  } catch(e) {
    try { localStorage.setItem('kenosis_lore_' + s.id, JSON.stringify(entries)); } catch(_) {}
  }
}

/* ── Render sidebar ── */
function renderList() {
  const list = document.getElementById('entryList');
  if (!entries.length) {
    list.innerHTML = '<div class="sidebar-empty">No lore entries yet.<br>Press <strong>+ New</strong> to begin.</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'entry-item' + (entry.id === currentId ? ' active' : '');
    item.dataset.id = entry.id;
    item.draggable = true;

    const icon = document.createElement('div');
    icon.className = 'entry-item-icon';
    if (entry.image) {
      const img = document.createElement('img');
      img.src = entry.image;
      icon.appendChild(img);
    } else {
      icon.textContent = entry.title?.[0]?.toUpperCase() || '?';
    }

    const body = document.createElement('div');
    body.className = 'entry-item-body';
    body.innerHTML = `
      <div class="entry-item-title">${escHtml(entry.title || 'Untitled')}</div>
      <div class="entry-item-sub">${escHtml((entry.body || '').slice(0, 48))}${(entry.body||'').length > 48 ? '…' : ''}</div>
    `;

    const del = document.createElement('button');
    del.className = 'entry-item-del';
    del.textContent = '✕';
    del.title = 'Delete entry';
    del.onclick = e => { e.stopPropagation(); deleteEntry(entry.id); };

    item.appendChild(icon);
    item.appendChild(body);
    item.appendChild(del);
    item.onclick = () => openEntry(entry.id);

    // Drag to reorder
    item.addEventListener('dragstart', onDragStart);
    item.addEventListener('dragover',  onDragOver);
    item.addEventListener('drop',      onDrop);
    item.addEventListener('dragend',   onDragEnd);

    list.appendChild(item);
  });
}

/* ── Drag reorder ── */
let dragId = null;
function onDragStart(e) { dragId = e.currentTarget.dataset.id; e.currentTarget.classList.add('dragging'); }
function onDragOver(e)  { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragEnd(e)   { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.entry-item').forEach(el => el.classList.remove('drag-over')); }
function onDrop(e) {
  e.preventDefault();
  const targetId = e.currentTarget.dataset.id;
  if (!dragId || dragId === targetId) return;
  const from = entries.findIndex(x => x.id === dragId);
  const to   = entries.findIndex(x => x.id === targetId);
  const [moved] = entries.splice(from, 1);
  entries.splice(to, 0, moved);
  entries.forEach((x, i) => x.order = i);
  renderList();
  persistEntries();
}

/* ── Open / view ── */
function openEntry(id) {
  if (editing && !confirm('Discard unsaved changes?')) return;
  editing = false;
  currentId = id;
  const entry = entries.find(e => e.id === id);
  if (!entry) return;

  document.getElementById('editorEmpty').style.display = 'none';
  document.getElementById('editorForm').style.display  = 'none';
  document.getElementById('readView').style.display    = '';

  document.getElementById('rv-title').textContent = entry.title || 'Untitled';
  document.getElementById('rv-body').textContent  = entry.body  || '';
  const img = document.getElementById('rv-image');
  if (entry.image) { img.src = entry.image; img.classList.add('visible'); }
  else             { img.src = ''; img.classList.remove('visible'); }

  renderList();
}

/* ── Edit ── */
function editCurrent() {
  const entry = entries.find(e => e.id === currentId);
  if (!entry) return;
  openEditForm(entry);
}

function openEditForm(entry) {
  editing = true;
  document.getElementById('editorEmpty').style.display = 'none';
  document.getElementById('readView').style.display    = 'none';
  document.getElementById('editorForm').style.display  = '';
  document.getElementById('editorToolbarLabel').textContent = entry.id ? 'Edit Entry' : 'New Entry';
  document.getElementById('f-title').value = entry.title || '';
  document.getElementById('f-body').value  = entry.body  || '';
  setImgPreview(entry.image || null);
}

function discardEdit() {
  editing = false;
  if (currentId) { openEntry(currentId); }
  else { showEmpty(); }
}

function showEmpty() {
  document.getElementById('editorEmpty').style.display = '';
  document.getElementById('editorForm').style.display  = 'none';
  document.getElementById('readView').style.display    = 'none';
  currentId = null;
  renderList();
}

/* ── New ── */
function newEntry() {
  if (editing && !confirm('Discard unsaved changes?')) return;
  currentId = null;
  openEditForm({ title: '', body: '', image: null });
}

/* ── Save ── */
async function saveEntry() {
  const title = document.getElementById('f-title').value.trim();
  const body  = document.getElementById('f-body').value.trim();
  const image = document.getElementById('imgPreview').src || null;
  const imgVisible = document.getElementById('imgPreview').classList.contains('visible');

  if (!title) { document.getElementById('f-title').focus(); toast('Please add a title'); return; }

  const isNew = !currentId;
  if (isNew) {
    const entry = {
      id: 'lore_' + Date.now(),
      title, body,
      image: imgVisible ? image : null,
      order: entries.length
    };
    entries.push(entry);
    currentId = entry.id;
  } else {
    const idx = entries.findIndex(e => e.id === currentId);
    if (idx !== -1) {
      entries[idx] = { ...entries[idx], title, body, image: imgVisible ? image : null };
    }
  }

  toast('Saving…');
  await persistEntries();
  editing = false;
  renderList();
  openEntry(currentId);
  toast('Saved');
}

/* ── Delete ── */
async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  entries.forEach((x, i) => x.order = i);
  toast('Deleting…');
  await persistEntries();
  if (currentId === id) showEmpty();
  renderList();
  toast('Deleted');
}

/* ── Image handling ── */
function handleImg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => setImgPreview(e.target.result);
  reader.readAsDataURL(file);
}

function setImgPreview(src) {
  const preview     = document.getElementById('imgPreview');
  const placeholder = document.getElementById('imgPlaceholder');
  const clear       = document.getElementById('imgClear');
  if (src) {
    preview.src = src;
    preview.classList.add('visible');
    placeholder.style.display = 'none';
    clear.classList.add('visible');
  } else {
    preview.src = '';
    preview.classList.remove('visible');
    placeholder.style.display = '';
    clear.classList.remove('visible');
  }
}

function clearImg(e) {
  e.stopPropagation();
  document.getElementById('f-img').value = '';
  setImgPreview(null);
}

/* ── Util ── */
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── Init ── */
(async function init() {
  await loadEntries();
  renderList();
})();
</script>
</body>
</html>
